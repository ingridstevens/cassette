name: build
on:
  push: { branches: ["**"], tags: ["v*"] }
  pull_request: {}
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Update the visual baselines (the visual job makes new screenshots and uploads them as an artifact)"
        type: boolean
        default: false
jobs:
  # Cheap checks on every push and pull request, on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix: { os: [macos-15, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Engine tests
        working-directory: engine
        run: uv run pytest -q
      - name: App typecheck, translations and build
        working-directory: app
        run: npm ci && npx tsc --noEmit && npm run i18n:check && npm run links:check && npm run build
  # Browser tests against the dev mock. Ubuntu only and a job of its own, so the three-system test job above is not slowed down.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: App dependencies (vite serves the page)
        working-directory: app
        run: npm ci
      - name: Playwright dependencies
        working-directory: app
        run: npm ci --prefix e2e --no-audit --no-fund
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/e2e/package-lock.json') }}
      - name: Install Chromium
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: End-to-end tests
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js test -c e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/e2e/playwright-report
            app/e2e/test-results
          retention-days: 7
  # Screenshot tests (light, dark, Arabic right to left, 1.5x text). They run in the Playwright container, pinned to the
  # version in app/e2e/package.json, so fonts and Chromium are the same every time; the baselines in
  # app/e2e/visual/__screenshots__ are only valid here. To refresh them, run this workflow by hand with
  # "Update the visual baselines" ticked and commit the files from the visual-baselines artifact.
  visual:
    runs-on: ubuntu-22.04
    container: mcr.microsoft.com/playwright:v1.64.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: App dependencies (vite serves the page)
        working-directory: app
        run: npm ci
      - name: Playwright dependencies
        working-directory: app
        run: npm ci --prefix e2e --no-audit --no-fund
      - name: Screenshot tests
        if: ${{ !inputs.update_visual_baselines }}
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js test -c e2e/visual/playwright.config.ts
      - name: Make new baselines
        if: ${{ inputs.update_visual_baselines }}
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js test -c e2e/visual/playwright.config.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_visual_baselines }}
        with:
          name: visual-baselines
          path: app/e2e/visual/__screenshots__
          retention-days: 7
      # The expected, actual and diff images of every screenshot that differs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            app/e2e/visual/playwright-report
            app/e2e/visual/test-results
          retention-days: 7
  package:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.update_visual_baselines)
    needs: test
    strategy:
      fail-fast: false
      matrix: { os: [macos-15, macos-15-intel, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test engine
        working-directory: engine
        run: uv run pytest -q
      - name: Bundle engine
        shell: bash
        run: engine/build_engine.sh
      - name: Package app
        working-directory: app
        run: npm ci && npm run package
      - uses: actions/upload-artifact@v4
        with: { name: "app-${{ matrix.os }}", path: "app/release/*.*" }
