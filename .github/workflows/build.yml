name: build
on: { push: { branches: ["**"], tags: ["v*"] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  # Cheap checks on every push and pull request, on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Engine tests
        working-directory: engine
        run: uv run pytest -q
      - name: App typecheck, translations and build
        working-directory: app
        run: npm ci && npx tsc --noEmit && npm run i18n:check && npm run build
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-13, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test engine
        working-directory: engine
        run: uv run pytest -q
      - name: Bundle engine
        shell: bash
        run: engine/build_engine.sh
      - name: Package app
        working-directory: app
        run: npm ci && npm run package -- --publish never
      - uses: actions/upload-artifact@v4
        with: { name: "app-${{ matrix.os }}", path: "app/release/*.*" }
  # Tags only: attach the Windows installer (and the other systems' packages) to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "app-*" }
      - name: Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          shopt -s nullglob
          files=(dist/*/*.exe dist/*/*.dmg dist/*/*.AppImage dist/*/*.deb)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes "${files[@]}"
