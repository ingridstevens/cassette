name: build
on:
  push: { branches: ["**"], tags: ["v*"] }
  pull_request: {}
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Update the visual baselines (the visual job makes new screenshots and uploads them as an artifact)"
        type: boolean
        default: false
# Every job reads the code and nothing else; a job that needs more says so itself.
permissions:
  contents: read
jobs:
  # Cheap checks on every push and pull request, on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix: { os: [macos-15, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Engine tests
        working-directory: engine
        run: uv run pytest -q
      - name: App typecheck, translations and build
        working-directory: app
        run: npm ci && npx tsc --noEmit && npm run i18n:check && npm run links:check && npm run build
  # Real speech through the real engine: transcribes docs/samples/test-interview-english-two-voices.m4a with the tiny model and checks the word error
  # rate (engine/tests/test_e2e.py). Ubuntu only, and a job of its own. This is the only place the model is downloaded (once, then cached by the pin
  # in models.py); the test itself never starts a download, and a plain `uv run pytest` skips it. CASSETTE_E2E=1 makes a missing model a failure.
  engine-e2e:
    runs-on: ubuntu-22.04
    env:
      CASSETTE_E2E: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Point the engine at the model cache (a job-level env cannot expand ~)
        run: echo "ENGINE_MODELS_DIR=$HOME/.cache/cassette-models" >> "$GITHUB_ENV"
      - name: Cache the tiny model
        id: models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/cassette-models
          key: cassette-models-tiny-${{ hashFiles('engine/src/engine/models.py') }}
      - name: Download the tiny model (cache miss only)
        if: steps.models.outputs.cache-hit != 'true'
        working-directory: engine
        run: uv run python -m engine models download tiny
      - name: Engine end-to-end test
        working-directory: engine
        run: uv run pytest -q tests/test_e2e.py
  # Browser tests against the dev mock. Ubuntu only and a job of its own, so the three-system test job above is not slowed down.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: App dependencies (vite serves the page)
        working-directory: app
        run: npm ci
      - name: Playwright dependencies
        working-directory: app
        run: npm ci --prefix e2e --no-audit --no-fund
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/e2e/package-lock.json') }}
      - name: Install Chromium
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: End-to-end tests
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js test -c e2e/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/e2e/playwright-report
            app/e2e/test-results
          retention-days: 7
  # Screenshot tests (light, dark, Arabic right to left, 1.5x text). They run in the Playwright container, pinned to the
  # version in app/e2e/package.json, so fonts and Chromium are the same every time; the baselines in
  # app/e2e/visual/__screenshots__ are only valid here. To refresh them, run this workflow by hand with
  # "Update the visual baselines" ticked and commit the files from the visual-baselines artifact.
  visual:
    runs-on: ubuntu-22.04
    container: mcr.microsoft.com/playwright:v1.64.1-jammy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: App dependencies (vite serves the page)
        working-directory: app
        run: npm ci
      - name: Playwright dependencies
        working-directory: app
        run: npm ci --prefix e2e --no-audit --no-fund
      - name: Screenshot tests
        if: ${{ !inputs.update_visual_baselines }}
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js test -c e2e/visual/playwright.config.ts
      - name: Make new baselines
        if: ${{ inputs.update_visual_baselines }}
        working-directory: app
        run: node e2e/node_modules/@playwright/test/cli.js test -c e2e/visual/playwright.config.ts --update-snapshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.update_visual_baselines }}
        with:
          name: visual-baselines
          path: app/e2e/visual/__screenshots__
          retention-days: 7
      # The expected, actual and diff images of every screenshot that differs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: visual-report
          path: |
            app/e2e/visual/playwright-report
            app/e2e/visual/test-results
          retention-days: 7
  # CycloneDX software bills of materials: the app's npm packages and the engine's Python packages. Runs on every push
  # and pull request so a broken generator shows up before a release; only a v* tag signs (attests) the files.
  sbom:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: SBOM of the app (npm, production packages)
        working-directory: app
        run: npm ci && npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --omit dev --output-format JSON --output-file ../sbom-app.cdx.json
      - name: SBOM of the engine (Python, production packages, from uv.lock)
        working-directory: engine
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-sbom.txt
          uvx --from cyclonedx-bom==9.0.0 cyclonedx-py requirements requirements-sbom.txt --of JSON -o ../sbom-engine.cdx.json
          rm requirements-sbom.txt
      - name: Check both files are CycloneDX with components
        run: |
          python3 - <<'PY'
          import json
          for f in ("sbom-app.cdx.json", "sbom-engine.cdx.json"):
              d = json.load(open(f))
              assert d["bomFormat"] == "CycloneDX", f
              assert len(d.get("components", [])) > 0, f
              print(f, d["specVersion"], len(d["components"]), "components")
          PY
      - name: Sign the SBOMs (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            sbom-app.cdx.json
            sbom-engine.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: sbom, path: "sbom-*.cdx.json" }
  package:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.update_visual_baselines)
    needs: test
    # id-token and attestations let the job sign the installers (build provenance); nothing here can write to the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: { os: [macos-15, macos-15-intel, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # Fail before the long build, not after it: the tag must be v plus the version in app/package.json (see docs/releasing.md).
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node app/scripts/check-versions.mjs "$GITHUB_REF_NAME"
      - name: Test engine
        working-directory: engine
        run: uv run pytest -q
      - name: Bundle engine
        shell: bash
        run: engine/build_engine.sh
      - name: Package app
        working-directory: app
        run: npm ci && npm run package
      - name: Checksums (SHA-256) of the installers
        working-directory: app/release
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          $sum *.dmg *.zip *.AppImage *.deb *.exe 2>/dev/null > "SHA256SUMS-${{ matrix.os }}.txt" || true
          test -s "SHA256SUMS-${{ matrix.os }}.txt"
          cat "SHA256SUMS-${{ matrix.os }}.txt"
      - name: Sign the installers and checksums (build provenance)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.exe
            app/release/SHA256SUMS-*.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "app-${{ matrix.os }}", path: "app/release/*.*" }
  # A v* tag makes a DRAFT release: generated notes, the installers, the checksum files and the SBOMs. It never publishes; the owner reads the
  # draft, runs the checklist in docs/releasing.md and presses Publish. Not exercised by pull requests (tags only). Only this job can write
  # to the repository (contents: write); actions: read lets `gh run download` fetch the artifacts of this run.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, sbom]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Check the tag matches the version
        run: node app/scripts/check-versions.mjs "$TAG"
      - name: Download the installers, checksums and SBOMs of this run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Create the draft release
        shell: bash
        run: |
          set -euo pipefail
          # Installers and checksum files only (not update metadata or block maps); a name used twice would silently drop a file, so stop instead.
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name 'SHA256SUMS-*.txt' -o -name 'sbom-*.cdx.json' \) | sort)
          test "${#files[@]}" -gt 0
          dupes=$(printf '%s\n' "${files[@]}" | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "Same file name twice: $dupes"; exit 1; fi
          printf '%s\n' "${files[@]}"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${files[@]}" --draft --verify-tag --generate-notes --title "Cassette $TAG" "${flags[@]}"
