name: build
on: { push: { branches: ["**"], tags: ["v*"] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  # Cheap checks on every push and pull request, on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Engine tests
        working-directory: engine
        run: uv run pytest -q
      - name: App typecheck, translations and build
        working-directory: app
        run: npm ci && npx tsc --noEmit && npm run i18n:check && npm run links:check && npm run build
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-13, ubuntu-22.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test engine
        working-directory: engine
        run: uv run pytest -q
      - name: Bundle engine
        shell: bash
        run: engine/build_engine.sh
      - name: Package app
        working-directory: app
        run: npm ci && npm run package
      - uses: actions/upload-artifact@v4
        with: { name: "app-${{ matrix.os }}", path: "app/release/*.*" }
