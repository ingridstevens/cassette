[project]
name = "engine"
version = "0.1.0"
description = "Local transcription + diarization engine"
license = "Unlicense"
requires-python = ">=3.10,<3.13"
dependencies = [
  "faster-whisper>=1.0.3",
  "pyannote.audio>=3.3,<4",
  "huggingface_hub>=0.23,<1.0",
  "imageio-ffmpeg>=0.5",
  "python-docx>=1.1",
  "torch>=2.2,<2.9",
  "torchaudio>=2.2,<2.9",
  "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "moonshine-voice>=0.1.5 ; platform_machine == 'arm64' and sys_platform == 'darwin' and platform_release >= '24'",  # its wheels need macOS 15 (Darwin 24); older Macs just do not get Moonshine
  "parakeet-mlx>=0.5 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "mlx-lm>=0.20 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Highlights and summaries on Windows and Linux. llama-cpp-python publishes no prebuilt wheels, so installing it compiles C++
# (Windows needs Visual Studio Build Tools and CMake). Kept out of the default install so `uv sync` works without a compiler.
# Install with: uv sync --extra llm
llm = ["llama-cpp-python>=0.3 ; platform_machine != 'arm64' or sys_platform != 'darwin'"]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Pinned to the classic default set (pycodestyle E, pyflakes F) so a ruff upgrade cannot add rules by itself; E731 and E741 are off on purpose (small lambdas, short `l` names).
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]
