appId: io.github.ingridstevens.local-transcriber
productName: Local Transcriber
directories: { output: release, buildResources: resources }  # resources/ holds icon.icns, icon.ico and icon.png; sources in resources/icon-src
files: [dist/**, dist-electron/**, package.json]
extraResources:
  - { from: ../engine/dist/engine, to: engine }
mac: { target: [dmg, zip], category: public.app-category.productivity, extendInfo: { NSMicrophoneUsageDescription: "Local Transcriber records from the microphone to write the words down while you speak. The audio stays on this computer." } }
linux: { target: [AppImage, deb], category: AudioVideo }
win: { target: [nsis], artifactName: "Local-Transcriber-Setup-${version}.${ext}" }
# Per-user install (no administrator prompt) that lets people choose the folder. Uninstalling keeps projects and models in the app data folder.
nsis: { oneClick: false, perMachine: false, allowToChangeInstallationDirectory: true, deleteAppDataOnUninstall: false }
