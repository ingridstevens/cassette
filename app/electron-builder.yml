appId: io.github.ingridstevens.cassette
productName: Cassette
directories: { output: release, buildResources: resources }  # resources/ holds icon.icns, icon.ico and icon.png; sources in resources/icon-src
files: [dist/**, dist-electron/**, package.json]
extraResources:
  - { from: ../engine/dist/engine, to: engine }
mac: { target: [dmg, zip], category: public.app-category.productivity, extendInfo: { NSMicrophoneUsageDescription: "Cassette records from the microphone to write the words down while you speak. The audio stays on this computer." } }
linux: { target: [AppImage, deb], category: AudioVideo }
win: { target: [nsis] }
